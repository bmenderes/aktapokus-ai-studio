[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aktapokus-ajan"
version = "0.1.0"
description = "OpenCode (ve Claude Code) motorlarini rol/model bazli suren, onay ve geri alma katmani"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
qr = ["segno>=1.6"]  # Telegram eslestirme QR kodu (istege bagli)

[project.scripts]
aktapokus = "aktapokus_ajan.cli:main_giris"

[tool.setuptools]
packages = ["aktapokus_ajan"]

[tool.setuptools.package-data]
aktapokus_ajan = ["web/*.html", "web/*.ico", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
