*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.55 "Lora",Georgia,"Noto Serif","Segoe UI Variable Text",system-ui,"Inter",serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{background:var(--panel2)}
button.pri{background:var(--sari);color:var(--tx);border-color:var(--sarikoyu);font-weight:600;box-shadow:0 1px 0 var(--sarikoyu)}
button.pri:hover{background:#ffd21f}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:3px 7px}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.mono{font-family:var(--mono);font-size:12px}
.badge{display:inline-block;font-size:12px;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--tx2)}
