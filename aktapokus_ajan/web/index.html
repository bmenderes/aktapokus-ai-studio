<!doctype html>
<html lang="tr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktapokus</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta name="google" content="notranslate">
<style>
:root{--bg:#f7f5f1;--panel:#fff;--panel2:#f1efe8;--line:#d3d1c7;--line2:#b4b2a9;--tx:#2c2c2a;--tx2:#5f5e5a;--tx3:#888780;--acc:#185fa5;--accbg:#e6f1fb;--ok:#3b6d11;--okbg:#eaf3de;--warn:#854f0b;--warnbg:#faeeda;--err:#a32d2d;--errbg:#fcebeb;--mono:ui-monospace,Consolas,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:12px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{background:var(--panel2)}
button.pri{background:var(--tx);color:#fff;border-color:var(--tx)}
button.pri:hover{background:#444441}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:3px 7px}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.mono{font-family:var(--mono);font-size:11px}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--tx2)}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-err{background:var(--errbg);color:var(--err)}.b-acc{background:var(--accbg);color:var(--acc)}
.row{display:flex;align-items:center;gap:6px}
#top{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#main{flex:1;min-height:0;display:grid;--sol-w:190px;--sag-w:46%;--b1:6px;--b2:6px;grid-template-columns:var(--sol-w) var(--b1) minmax(0,1fr) var(--b2) var(--sag-w);grid-template-rows:minmax(0,1fr)}
#sol{background:var(--panel2);border-right:1px solid var(--line);padding:8px 10px;overflow:auto;min-height:0}
#orta{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
#akis{flex:1;overflow:auto;padding:10px}
#girdi{border-top:1px solid var(--line);padding:8px 10px}
#sag{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
.sec{font-size:11px;color:var(--tx3);margin:10px 0 4px}
.rol{display:flex;gap:6px;align-items:flex-start;margin:5px 0;cursor:pointer}
.rol .n{font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);margin-top:5px;flex:none}
.dot.calisiyor{background:var(--acc)}.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel)}
.kullanici{margin-left:auto;max-width:92%;background:var(--panel2);border-radius:8px;padding:6px 9px;margin-top:8px;white-space:pre-wrap}
.adim{margin:6px 0}
.canli{white-space:pre-wrap;color:var(--tx2);max-height:80px;overflow:hidden;font-size:11px}
details>summary{cursor:pointer;color:var(--tx2)}
pre.yama{background:var(--panel2);border-radius:6px;padding:6px;overflow:auto;max-height:240px;font:11px/1.45 var(--mono);margin:6px 0 0}
.y-ekle{color:var(--ok)}.y-sil{color:var(--err)}.y-baslik{color:var(--tx3)}
#sekmeler{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.sekme{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:7px 9px;color:var(--tx2)}
.sekme.on{color:var(--tx);border-bottom-color:var(--tx)}
.panel{flex:1;min-height:0;overflow:auto;padding:8px;display:none}
.panel.on{display:block}
#p-onizleme.on{display:flex;flex-direction:column}
#cerceve{flex:1;min-height:320px;width:100%;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff}
.agac div{padding:1px 0;white-space:nowrap}
.agac .d{cursor:pointer}.agac .f{cursor:pointer}
.md h1{font-size:16px;margin:8px 0 4px;font-weight:600}.md h2{font-size:14px;margin:8px 0 4px;font-weight:600}.md h3{font-size:13px;margin:6px 0 3px;font-weight:600}
.md p{margin:4px 0}.md code{font:11px var(--mono);background:var(--panel2);padding:0 4px;border-radius:4px}
.md pre{background:var(--panel2);border-radius:6px;padding:6px;overflow:auto;margin:4px 0}.md pre code{padding:0;background:none}
.md ul,.md ol{margin:4px 0;padding-left:18px}.md blockquote{margin:4px 0;padding-left:8px;border-left:2px solid var(--line2);color:var(--tx2)}
.md table{border-collapse:collapse;margin:4px 0;font-size:11px}.md td,.md th{border:1px solid var(--line);padding:2px 6px}.md hr{border:none;border-top:1px solid var(--line);margin:8px 0}
#klasorSec{padding:16px;max-width:520px}
.liste{border:1px solid var(--line);border-radius:6px;max-height:200px;overflow:auto;margin:6px 0}
.liste div{padding:2px 8px;cursor:pointer}.liste div:hover{background:var(--panel2)}
.arac{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:3px 0;background:var(--panel2);font:11px var(--mono);min-width:0}
.arac-t{font-weight:500;flex:none;padding:0 5px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.arac-h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.arac-yaz{background:var(--warnbg);border-color:#e4c896}.arac-yaz .arac-t{color:var(--warn)}
.arac-komut{background:var(--errbg);border-color:#e8b9b9}.arac-komut .arac-t{color:var(--err)}
.arac-oku .arac-t{color:var(--tx2)}
#akisCipi{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}#akisCipi:hover{color:var(--tx)}
body{position:relative}
#ayarlar{display:none;position:absolute;left:0;right:0;bottom:0;top:38px;background:var(--bg);z-index:20;grid-template-columns:210px minmax(0,1fr)}
#ayarlar.on{display:grid}
#ayarMenu{background:var(--panel2);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#ayarMenu button{text-align:left;border:none;background:none;padding:6px 10px;border-radius:6px;color:var(--tx2)}
#ayarMenu button:hover{background:var(--panel)}
#ayarMenu .ayar-oge.on{background:var(--panel);color:var(--tx);font-weight:500;box-shadow:0 0 0 1px var(--line)}
#ayarMenu .geri{margin-bottom:8px;color:var(--tx)}
#ayarIcerik{overflow:auto;padding:18px 26px 40px;max-width:820px;width:100%}
.ayar-baslik{font-size:18px;font-weight:500;margin:0 0 2px}
.ayar-alt{margin-bottom:12px;white-space:normal}
.ayar-kart{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0}
.ayar-satir{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;border-top:1px solid var(--line)}
.ayar-kart>.ayar-satir:first-child,.ayar-kart>.ayar-grup+.ayar-satir{border-top:none}
.ayar-grup{padding:8px 14px;font-weight:500;background:var(--panel2);border-radius:10px 10px 0 0}
.ayar-model{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.ayar-kart>.ayar-grup+.ayar-model{border-top:none}
#sol{display:flex;flex-direction:column}
.rol{padding:3px 5px;border-radius:6px}.rol:hover{background:var(--panel)}.rol.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
#girdi{position:relative}
.cip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:1px 9px;background:var(--panel2);font-size:11px}
.cip:hover{background:var(--panel)}.cip .dot{margin-top:0}
.model-menu{position:absolute;left:10px;right:10px;bottom:100%;margin-bottom:4px;max-height:360px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.model-liste{overflow:auto;margin:6px 0;flex:1;min-height:60px}
.model-grup{font-size:11px;color:var(--tx3);margin:8px 0 2px}
.model-oge{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer}.model-oge:hover{background:var(--panel2)}
.model-alt{border-top:1px solid var(--line);padding-top:6px}
#durumCubugu{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;min-height:24px}
.durum-hazir{color:var(--tx2)}.durum-calisiyor{color:var(--acc)}.durum-bekle{color:var(--warn)}
.cip.ortam b{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{padding:0 7px;line-height:1.4}
.model-oge.yok{opacity:.55}
.modal-arka{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:30}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;width:min(580px,92vw);max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.klasor-liste{height:290px;max-height:none;outline:none}
.klasor-liste:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
.k-oge,.k-ust{padding:3px 10px;cursor:pointer;border-radius:4px;user-select:none}
.k-ust{color:var(--tx2)}
.k-oge:hover,.k-ust:hover{background:var(--panel2)}
.k-oge.on{background:var(--accbg);color:var(--acc);font-weight:500}
.cikti{display:flex;gap:8px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin:4px 0;cursor:pointer;background:var(--panel)}
.cikti:hover{background:var(--panel2)}
.cikti-ad{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cikti-r{flex:none;min-width:36px;text-align:center;font:11px var(--mono);padding:1px 4px;border-radius:4px;background:var(--panel2);color:var(--tx2)}
.bolucu{cursor:col-resize;position:relative;background:var(--panel);touch-action:none}
.bolucu::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line);transition:background .12s,width .12s}
.bolucu:hover::after,body.suruklenir .bolucu::after{background:var(--acc);width:3px;margin-left:-1px}
body.suruklenir{cursor:col-resize;user-select:none}
body.suruklenir iframe{pointer-events:none}
#main.sol-kapali #sol,#main.sag-kapali #sag{visibility:hidden;overflow:hidden;padding:0;border:none}
#main.sol-kapali #bolucuSol,#main.sag-kapali #bolucuSag{visibility:hidden;pointer-events:none;overflow:hidden}  /* display:none OLMAZ: izgara yerlesimi (sutun sirasi) bozulur */
.panel-dugme{padding:1px 8px;font-size:14px;line-height:1.3;color:var(--tx3)}
.panel-dugme.on{color:var(--tx);background:var(--panel2)}
@media (max-width:900px){#ayarlar.on{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}#ayarMenu{flex-direction:row;overflow:auto;border-right:none;border-bottom:1px solid var(--line)}#ayarMenu button{white-space:nowrap}#ayarIcerik{padding:12px}}
@media (max-width:900px){#main{grid-template-columns:1fr!important}#sol,#sag{border:none}.bolucu,.panel-dugme{display:none}}
</style>
</head>
<body>
<div id="top">
  <div class="row"><b>Aktapokus</b><span id="klasorAd" class="mut"></span></div>
  <div class="row" style="gap:2px"><button id="solDugme" class="panel-dugme on" title="Sol paneli aç/kapat (Alt+1)">◧</button><button id="sagDugme" class="panel-dugme on" title="Sağ paneli aç/kapat (Alt+2)">◨</button></div>
</div>
<div id="main">
  <div id="sol">
    <button id="yeniGorev" class="pri" style="width:100%">+ Yeni görev</button>
    <div class="sec">Görevler</div><div id="gecmis" class="mut3">-</div>
    <div class="sec">Klon</div><div id="klon" class="mut">-</div>
    <div style="margin-top:auto;padding-top:10px"><button id="ayarDugme" style="width:100%" title="Sağlayıcılar, modeller, roller, CLI'lar, kullanım">⚙ Ayarlar</button></div>
  </div>
  <div class="bolucu" id="bolucuSol" title="Sürükleyin: genişliği değiştirin · çift tıklayın: sıfırla"></div>
  <div id="orta">
    <div id="akis"></div>
    <div id="girdi">
      <textarea id="gorev" rows="2" style="width:100%;resize:none" placeholder="Bir görev yazın… (Enter gönderir, Shift+Enter yeni satır)"></textarea>
      <div class="row" style="justify-content:space-between;margin-top:6px;gap:10px;align-items:flex-start"><span style="min-width:0;flex:1"><span class="row" style="gap:6px;flex-wrap:wrap"><span id="ortamCipi"></span><span id="rolCipleri" class="row" style="gap:6px;flex-wrap:wrap"></span></span><span id="girdiBilgi" class="mut3" style="display:block;margin-top:2px"></span></span><span class="row"><button id="durdur" style="display:none">Durdur</button><button id="gonder" class="pri">Gönder</button></span></div>
    </div>
  </div>
  <div class="bolucu" id="bolucuSag" title="Sürükleyin: genişliği değiştirin · çift tıklayın: sıfırla"></div>
  <div id="sag">
    <div id="sekmeler"><button class="sekme on" data-p="p-onizleme">Önizleme</button><button class="sekme" data-p="p-degisiklik">Değişiklikler</button><button class="sekme" data-p="p-ciktilar">Çıktılar</button><button class="sekme" data-p="p-belgeler">Belgeler</button><button class="sekme" data-p="p-dosyalar">Dosyalar</button><button class="sekme" data-p="p-gunluk">Günlük</button></div>
    <div id="p-onizleme" class="panel on">
      <div class="row"><span id="onizUrl" class="mono mut" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><label class="row mut"><input type="checkbox" id="canliOnizleme" checked> canlı</label><button id="yenile" title="Yenile">Yenile</button><button id="onizAyri" title="Önizlemeyi ayrı bir pencerede aç">↗ Ayrı pencere</button></div>
      <div class="row" style="margin-top:4px"><select id="onizTur"><option value="dosya">Proje dosyaları</option><option value="url">Yerel sunucu</option></select><input id="onizYol" style="flex:1" placeholder="/index.html" value="/"><button id="onizGit">Git</button></div>
      <iframe id="cerceve" sandbox="allow-scripts allow-forms allow-same-origin" title="Önizleme"></iframe>
      <div class="mut3" style="margin-top:4px">Önizleme ayrı bir kapıda, yalıtılmış çerçevede çalışır; uygulamaya erişemez.</div>
    </div>
    <div id="p-degisiklik" class="panel"></div>
    <div id="p-ciktilar" class="panel"></div>
    <div id="p-belgeler" class="panel"><div class="row"><select id="belgeSec" style="max-width:100%"></select><span class="mut3">işlenmiş Markdown</span></div><div id="belgeIcerik" class="md" style="margin-top:6px"></div></div>
    <div id="p-dosyalar" class="panel"><div id="agac" class="agac mono"></div><div id="dosyaGoster" style="margin-top:8px"></div></div>
    <div id="p-gunluk" class="panel mono"><div id="gunluk"></div></div>
  </div>
</div>
<div id="durumCubugu">
  <div class="row"><span id="gitRozet"></span><span id="korRozet"></span><span id="durumMetni" class="durum-hazir">Hazır</span></div>
  <div class="row mut"><span id="tokenYazi">token 0</span><span style="width:70px;height:4px;background:var(--panel2);border-radius:2px;display:inline-block"><span id="tokenCubuk" style="display:block;height:4px;width:0;background:var(--tx2);border-radius:2px"></span></span><span id="baglanti" class="badge">bağlanıyor</span></div>
</div>
<div id="ayarlar"><div id="ayarMenu"></div><div id="ayarIcerik"></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const T=(()=>{const m=location.hash.match(/t=([\w-]+)/);if(m){try{sessionStorage.setItem("t",m[1])}catch(e){}history.replaceState(null,"",location.pathname)}try{return sessionStorage.getItem("t")||""}catch(e){return m?m[1]:""}})();
async function api(yol,o={}){const r=await fetch(yol,{method:o.method||"GET",headers:{"X-Aktapokus-Token":T,"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const h=new Error((j&&j.hata)||("HTTP "+r.status));h.kod=r.status;throw h}return j}
function e(tag,a,...c){const n=document.createElement(tag);if(a)for(const k in a){if(k==="class")n.className=a[k];else if(k.startsWith("on")&&typeof a[k]==="function")n[k]=a[k];else if(k==="text")n.textContent=a[k];else n.setAttribute(k,a[k])}for(const x of c){if(x==null)continue;n.append(x.nodeType?x:document.createTextNode(x))}return n}
const S={planDugmeleri:{},planEtiket:{},klasor:null,ayar:null,kosu:null,rolDurum:{},adimDiv:{},son:0,butce:200000,canliDiv:null,fark:null,kararBekliyor:false,imza:null,degisen:{}};
function md(src){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const satir=s=>{s=esc(s);s=s.replace(/`([^`]+)`/g,"<code>$1</code>");s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>/^(https?:\/\/|#)/.test(u)?'<a href="'+u.replace(/"/g,"%22")+'" target="_blank" rel="noopener noreferrer">'+t+"</a>":t);return s};
  const L=src.replace(/\r\n/g,"\n").split("\n");let h="",i=0;
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;h+="<pre><code>"+esc(b.join("\n"))+"</code></pre>";continue}
    let m;if(m=l.match(/^(#{1,3})\s+(.*)$/)){h+="<h"+m[1].length+">"+satir(m[2])+"</h"+m[1].length+">";i++;continue}
    if(/^\s*([-*_])\1\1+\s*$/.test(l)){h+="<hr>";i++;continue}
    if(/^\s*>/.test(l)){let b=[];while(i<L.length&&/^\s*>/.test(L[i]))b.push(L[i++].replace(/^\s*>\s?/,""));h+="<blockquote>"+satir(b.join(" "))+"</blockquote>";continue}
    if(/^\s*[-*]\s+/.test(l)){h+="<ul>";while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))h+="<li>"+satir(L[i++].replace(/^\s*[-*]\s+/,""))+"</li>";h+="</ul>";continue}
    if(/^\s*\d+\.\s+/.test(l)){h+="<ol>";while(i<L.length&&/^\s*\d+\.\s+/.test(L[i]))h+="<li>"+satir(L[i++].replace(/^\s*\d+\.\s+/,""))+"</li>";h+="</ol>";continue}
    if(/^\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\|[\s:|-]+\|\s*$/.test(L[i+1])){const hd=l.split("|").slice(1,-1);i+=2;h+="<table><tr>"+hd.map(c=>"<th>"+satir(c.trim())+"</th>").join("")+"</tr>";while(i<L.length&&/^\|.*\|\s*$/.test(L[i]))h+="<tr>"+L[i++].split("|").slice(1,-1).map(c=>"<td>"+satir(c.trim())+"</td>").join("")+"</tr>";h+="</table>";continue}
    if(!l.trim()){i++;continue}
    let p=[];while(i<L.length&&L[i].trim()&&!/^(```|#{1,3}\s|\s*[-*]\s|\s*\d+\.\s|\s*>|\|)/.test(L[i]))p.push(L[i++]);if(!p.length){p.push(L[i++])}h+="<p>"+satir(p.join(" "))+"</p>"}
  return h}
function sekme(id){document.querySelectorAll(".sekme").forEach(b=>b.classList.toggle("on",b.dataset.p===id));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===id));if(id==="p-ciktilar")ciktilariYukle();sagiAc()}
document.querySelectorAll(".sekme").forEach(b=>b.onclick=()=>sekme(b.dataset.p));
function akisaEkle(n){const a=$("#akis");const alta=a.scrollTop+a.clientHeight>=a.scrollHeight-40;a.append(n);if(alta)a.scrollTop=a.scrollHeight;return n}
function gunluge(m){const g=$("#gunluk");g.append(e("div",{class:"mut",text:new Date().toLocaleTimeString("tr-TR")+"  "+m}))}
function tokenGuncelle(t){$("#tokenYazi").textContent="token "+t.toLocaleString("tr-TR")+" / "+S.butce.toLocaleString("tr-TR");$("#tokenCubuk").style.width=Math.min(100,Math.round(100*t/S.butce))+"%"}

function agacCiz(liste){const a=$("#agac");a.textContent="";const kok={};for(const f of liste){const p=f.yol.split("/");let n=kok;p.forEach((s,i)=>{n=n[s]=n[s]||(i===p.length-1?{__f:f.yol}:{})})}
  const ciz=(n,kap,d)=>{for(const k of Object.keys(n).sort((x,y)=>{const a1=n[x].__f?1:0,b1=n[y].__f?1:0;return a1-b1||x.localeCompare(y)})){const c=n[k];if(c.__f){const dur=S.degisen[c.__f];const sat=e("div",{class:"f",style:"padding-left:"+d*12+"px",onclick:()=>dosyaGoster(c.__f)});if(dur)sat.append(e("span",{style:"color:var(--"+(dur==="A"?"ok":dur==="D"?"err":"warn")+")",text:dur+" "}));sat.append(k);kap.append(sat)}else{const sat=e("div",{class:"d mut",style:"padding-left:"+d*12+"px",text:"▸ "+k});kap.append(sat);const alt=e("div");kap.append(alt);let ac=d<1;alt.style.display=ac?"":"none";sat.textContent=(ac?"▾ ":"▸ ")+k;sat.onclick=()=>{ac=!ac;alt.style.display=ac?"":"none";sat.textContent=(ac?"▾ ":"▸ ")+k};ciz(c,alt,d+1)}}};ciz(kok,a,0)}
async function dosyaGoster(yol){const g=$("#dosyaGoster");g.textContent="";try{const r=await api("/api/dosya?yol="+encodeURIComponent(yol));g.append(e("div",{class:"row"},e("b",{text:yol}),yol.toLowerCase().endsWith(".md")?e("button",{text:"Belgelerde aç",onclick:()=>{$("#belgeSec").value=yol;belgeAc(yol);sekme("p-belgeler")}}):null));
  if(r.ikili)g.append(e("div",{class:"mut3",text:"(ikili dosya)"}));else{g.append(e("pre",{class:"yama",text:r.icerik}));if(r.kesildi)g.append(e("div",{class:"mut3",text:"(kısaltıldı)"}))}}catch(x){g.append(e("div",{class:"badge b-err",text:x.message}))}}
function belgeleriCiz(l){const s=$("#belgeSec");const mevcut=s.value;s.textContent="";if(!l.length){s.append(e("option",{text:"(Markdown dosyası yok)"}));$("#belgeIcerik").textContent="";return}for(const y of l)s.append(e("option",{value:y,text:y}));const sec=l.includes(mevcut)?mevcut:(l.find(x=>/^readme\.md$/i.test(x))||l[0]);s.value=sec;belgeAc(sec)}

  $("#onizUrl").textContent=url;$("#cerceve").src=url}

async function izle(){if(!S.klasor||!$("#canliOnizleme").checked)return;try{const r=await api("/api/imza");if(S.imza&&r.imza!==S.imza){S.imza=r.imza;yenileOnizleme();dosyalariYukle()}else if(!S.imza)S.imza=r.imza}catch(x){}}

/* ---- Ortam cipi (proje + TAM klasor yolu), proje menusu ve yeni klasor secici ---- */
const yolAd=y=>String(y||"").split(/[\\/]/).filter(Boolean).pop()||String(y||"");
function yolKisalt(y,n){y=String(y||"");if(y.length<=n)return y;const p=y.split(/[\\/]/).filter(Boolean);let s="…\\"+p.slice(-2).join("\\");if(s.length>n)s="…\\"+p[p.length-1];return s.length>n?"…"+s.slice(-(n-1)):s}
const katla=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ı/g,"i");
function ortamCipiCiz(){const c=$("#ortamCipi");c.textContent="";
  c.append(e("button",{class:"cip ortam",title:S.klasor?"Çalışma klasörü: "+S.klasor+"\nTıklayın: projeyi değiştir":"Proje klasörü seçilmedi",onclick:ev=>{ev.stopPropagation();ortamMenusu()}},e("span",{text:"⌂"}),e("b",{text:S.klasor?yolAd(S.klasor):"Proje seçin"}),e("span",{class:"mut",text:S.klasor?yolKisalt(S.klasor,34):"klasör yok"}),e("span",{class:"mut3",text:"▾"})))}
function ortamMenusuKapat(){const m=$("#ortamMenu");if(m)m.remove()}
document.addEventListener("click",ev=>{const m=$("#ortamMenu");if(m&&!m.contains(ev.target))ortamMenusuKapat()});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")ortamMenusuKapat()});
async function projeSec(yol,gitSor=true){
  try{await api("/api/klasor",{method:"POST",body:{yol,git_baslat:false}})}
  catch(x){if(x.kod===428&&gitSor){if(!confirm("Bu klasör bir git deposu değil. Geri alma için gerekli.\nBu klasörde 'git init' çalıştırılsın mı?\n\n"+yol))return false;await api("/api/klasor",{method:"POST",body:{yol,git_baslat:true}})}else throw x}
  await durumYukle();await dosyalariYukle();await onizlemeKur();return true}
async function ortamMenusu(){const eski=$("#ortamMenu");if(eski){eski.remove();return}
  modelMenusuKapat();
  if(S.kosuAktif){$("#girdiBilgi").textContent="görev çalışırken proje değiştirilemez";return}
  const m=e("div",{id:"ortamMenu",class:"model-menu"});
  const ara=e("input",{placeholder:"Proje ara…",style:"width:100%",autocomplete:"off"});const liste=e("div",{class:"model-liste"});
  m.append(e("div",{class:"model-grup",style:"margin-top:0",text:"Ortam: bu bilgisayar · son projeler"}),ara,liste,e("div",{class:"model-alt"},e("button",{text:"Klasöre gözat…",onclick:()=>{ortamMenusuKapat();klasorSecimiAc()}})));
  $("#girdi").append(m);ara.focus();
  let projeler=[];try{projeler=(await api("/api/projeler")).projeler}catch(x){}
  const ciz=()=>{liste.textContent="";const q=katla(ara.value.trim());let n=0;
    for(const p of projeler){if(q&&!katla(p.ad+" "+p.yol).includes(q))continue;n++;const secili=!!S.klasor&&S.klasor.toLowerCase()===p.yol.toLowerCase();
      const unut=e("button",{class:"mini",text:"×",title:"Listeden kaldır (klasöre dokunulmaz)",onclick:async ev=>{ev.stopPropagation();try{await api("/api/projeler/unut",{method:"POST",body:{id:p.id}});projeler=projeler.filter(x=>x.id!==p.id);ciz()}catch(x){alert(x.message)}}});
      liste.append(e("div",{class:"model-oge"+(p.var?"":" yok"),title:p.yol+(p.var?"":"\n(klasör artık yok)"),onclick:async()=>{if(!p.var){alert("Klasör artık yok: "+p.yol);return}ortamMenusuKapat();try{await projeSec(p.yol)}catch(x){alert(x.message)}}},
        e("span",{style:"min-width:0;overflow:hidden"},e("div",{style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap",text:p.ad}),e("div",{class:"mut3 mono",style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap",text:p.yol})),
        e("span",{class:"row",style:"flex:none"},e("span",{class:"mut3",text:secili?"✓":""}),unut)))}
    if(!n)liste.append(e("div",{class:"mut3",style:"padding:4px 6px",text:q?"Eşleşen proje yok.":"Henüz proje yok. 'Klasöre gözat…' ile ekleyin."}))};
  ara.oninput=ciz;ara.onkeydown=ev=>{if(ev.key==="Enter"){const ilk=liste.querySelector(".model-oge");if(ilk)ilk.click()}};ciz()}
async function klasorSecimiAc(){if($("#klasorSec"))return;
  const arka=e("div",{id:"klasorSec",class:"modal-arka"});const k=e("div",{class:"modal"});arka.append(k);
  const yol=e("input",{style:"width:100%",placeholder:"C:\\yol\\proje   (Enter: bu yola git)",autocomplete:"off",spellcheck:"false"});
  const son=e("div",{class:"row",style:"gap:4px;flex-wrap:wrap;margin-top:6px"});
  const kisayol=e("div",{class:"row",style:"gap:4px;flex-wrap:wrap;margin:6px 0"});
  const liste=e("div",{class:"liste klasor-liste",tabindex:"0"});
  const hedef=e("div",{class:"mut3 mono",style:"white-space:normal;min-height:16px;margin-top:4px"});
  const hata=e("div",{class:"badge b-err",style:"display:none;margin-top:6px;white-space:normal"});
  const gb=e("label",{class:"row mut",style:"margin-top:6px"},e("input",{type:"checkbox",id:"gitBaslat"}),"Klasör git deposu değilse başlat (yalnızca bu klasörde 'git init')");
  let mevcut=null,isimler=[],sec=-1,tampon="",tamponZaman=0;
  const birles=(a,b)=>a+(a.endsWith("\\")||a.endsWith("/")?"":"\\")+b;
  const secDugme=e("button",{class:"pri",text:"Bu klasörü seç"});
  const hedefYolu=()=>mevcut?(sec>=0?birles(mevcut.yol,isimler[sec]):mevcut.yol):"";
  const hedefGuncelle=()=>{const h=hedefYolu();hedef.textContent=h?"Seçilecek: "+h:"";secDugme.textContent=sec>=0?"Seç: "+isimler[sec]:"Bu klasörü seç"};
  const isaretle=i=>{sec=i;const ogeler=liste.querySelectorAll(".k-oge");ogeler.forEach((x,j)=>x.classList.toggle("on",j===i));if(ogeler[i])ogeler[i].scrollIntoView({block:"nearest"});hedefGuncelle()};
  const goz=async y=>{try{const r=await api("/api/klasorler"+(y?"?yol="+encodeURIComponent(y):""));mevcut=r;yol.value=r.yol;isimler=r.klasorler;sec=-1;tampon="";
      kisayol.textContent="";for(const q of r.kisayollar)kisayol.append(e("button",{text:q.ad,title:q.yol,onclick:()=>{goz(q.yol);liste.focus()}}));
      liste.textContent="";if(r.ust)liste.append(e("div",{class:"k-ust",text:"↑ üst klasör   (Backspace)",onclick:()=>{goz(r.ust);liste.focus()}}));
      isimler.forEach((a,i)=>liste.append(e("div",{class:"k-oge",text:a,onclick:()=>{isaretle(i);liste.focus()},ondblclick:()=>goz(birles(r.yol,a))})));
      if(!isimler.length)liste.append(e("div",{class:"mut3",style:"padding:6px 10px",text:"(alt klasör yok)"}));
      hedefGuncelle();hata.style.display="none"}catch(x){hata.textContent=x.message;hata.style.display=""}};
  const kapat=()=>arka.remove();
  const sonuc=async()=>{hata.style.display="none";const h=hedefYolu();if(!h)return;
    try{await api("/api/klasor",{method:"POST",body:{yol:h,git_baslat:$("#gitBaslat").checked}});kapat();await durumYukle();await dosyalariYukle();await onizlemeKur()}
    catch(x){hata.textContent=x.kod===428?"Bu klasör git deposu değil. Geri alma için gerekli: kutuyu işaretleyip tekrar deneyin.":x.message;hata.style.display=""}};
  secDugme.onclick=sonuc;
  arka.addEventListener("keydown",ev=>{
    if(ev.target===yol){if(ev.key==="Enter"){ev.preventDefault();goz(yol.value.trim())}else if(ev.key==="Escape")kapat();return}
    if(ev.key==="Escape"){ev.preventDefault();kapat();return}
    const dugme=ev.target.tagName==="BUTTON"||ev.target.type==="checkbox";
    if(ev.key==="ArrowDown"){ev.preventDefault();isaretle(Math.min(isimler.length-1,sec+1))}
    else if(ev.key==="ArrowUp"){ev.preventDefault();isaretle(Math.max(0,sec-1))}
    else if(ev.key==="Enter"&&!dugme){ev.preventDefault();if(ev.ctrlKey||sec<0)sonuc();else goz(birles(mevcut.yol,isimler[sec]))}
    else if(ev.key==="Backspace"&&!dugme){ev.preventDefault();if(tampon){tampon=tampon.slice(0,-1)}else if(mevcut&&mevcut.ust){goz(mevcut.ust);return}}
    else if(ev.key.length===1&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey&&!(dugme&&ev.key===" ")){ev.preventDefault();const t=Date.now();if(t-tamponZaman>900)tampon="";tamponZaman=t;tampon+=katla(ev.key)}
    else return;
    if(tampon&&(ev.key.length===1||ev.key==="Backspace")){const kk=isimler.map(katla);let i=kk.findIndex(a=>a.startsWith(tampon));if(i<0)i=kk.findIndex(a=>a.includes(tampon));if(i>=0)isaretle(i)}});
  arka.addEventListener("mousedown",ev=>{if(ev.target===arka)kapat()});
  k.append(e("b",{text:"Proje klasörünü seçin"}),son,kisayol,yol,liste,hedef,e("div",{class:"mut3",style:"margin-top:2px",text:"Harf yazarak klasöre atlayın · ↑↓ gezin · Enter: içine gir · Backspace: üst klasör · Esc: kapat"}),gb,e("div",{class:"row",style:"margin-top:8px"},secDugme,e("button",{text:"Kapat",onclick:kapat})),hata);
  document.body.append(arka);
  try{const pl=(await api("/api/projeler")).projeler.filter(p=>p.var).slice(0,5);if(pl.length){son.append(e("span",{class:"mut3",text:"Son projeler:"}));for(const p of pl)son.append(e("button",{text:p.ad,title:p.yol,onclick:async()=>{try{if(await projeSec(p.yol))kapat()}catch(x){hata.textContent=x.message;hata.style.display=""}}}))}}catch(x){}
  await goz(S.klasor||"");liste.focus()}
async function onizlemeKur(){try{const r=await api("/api/onizleme");onizTaban=r.url;onizGoster()}catch(x){}}
async function olayAkisi(){let bekle=500;for(;;){try{const r=await fetch("/api/olaylar?son="+S.son,{headers:{"X-Aktapokus-Token":T}});if(!r.ok)throw new Error("HTTP "+r.status);$("#baglanti").textContent="canlı";$("#baglanti").className="badge b-ok";bekle=500;const rd=r.body.getReader();const dec=new TextDecoder();let tam="";for(;;){const {done,value}=await rd.read();if(done)break;tam+=dec.decode(value,{stream:true});let i;while((i=tam.indexOf("\n\n"))>=0){const blok=tam.slice(0,i);tam=tam.slice(i+2);const d=blok.split("\n").filter(x=>x.startsWith("data:")).map(x=>x.slice(5).trim()).join("");if(d){try{olayIsle(JSON.parse(d))}catch(x){console.error(x)}}}}}catch(x){}
    $("#baglanti").textContent="bağlantı yok";$("#baglanti").className="badge b-err";await new Promise(r=>setTimeout(r,bekle));bekle=Math.min(bekle*2,8000)}}
(async()=>{if(!T){document.body.textContent="Token yok: arayüzü terminalde yazdırılan adresle açın.";return}await durumYukle();if(!S.klasor)klasorSecimiAc();else{await dosyalariYukle();await onizlemeKur()}olayAkisi()})();
